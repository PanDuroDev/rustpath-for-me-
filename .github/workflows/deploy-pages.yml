name: Build and deploy RustPath

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "content/**"
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check scripts/lib/markdown.mjs
          node --check scripts/lib/content.mjs
          node --check scripts/build.mjs
          node --check site/assets/site.js
          node --check site/assets/lesson.js

      - name: Test the content system
        run: node --test tests/markdown.test.mjs tests/build.test.mjs

      - name: Build the site
        run: node scripts/build.mjs

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
