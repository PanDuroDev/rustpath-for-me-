name: Deploy learning dashboard

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "lessons/**"
      - "LEARNING_PROGRESS.md"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "lessons/**"
      - "LEARNING_PROGRESS.md"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/common.js
          node --check docs/progress.js
          node --check docs/lesson.js
          node --check scripts/validate-progress.mjs
          node --check scripts/validate-lessons.mjs
      - name: Validate progress data
        run: node scripts/validate-progress.mjs
      - name: Validate interactive lesson
        run: node scripts/validate-lessons.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site _site/lessons
          cp -R docs/. _site/
          cp LEARNING_PROGRESS.md _site/LEARNING_PROGRESS.md
          cp -R lessons/. _site/lessons/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
